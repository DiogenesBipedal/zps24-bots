// NavBot quota for the ZPS 2.4 bot server
// fixed 1 = always keep exactly <target> bots, even while nobody is on a team
sm_navbot_quota_target "11"
sm_navbot_quota_fixed "1"
// 0 = never kick all bots when no human is on a team
sm_navbot_quota_empty_server "0"
sm_navbot_quota_ignore_other_bots "1"
sm_navbot_quota_use_smart_kick "1"
sm_navbot_quota_check_teams "1"
