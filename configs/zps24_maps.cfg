// Per-map survivor hold-outs, for maps where the best place to hold isn't the building the
// survivors spawn in. Copied to addons/sourcemod/configs/zps24_maps.cfg.
//
//   "home"    where every survivor bot holds out (a point on the nav mesh, inside the building)
//   "radius"  how far around it bots look for defend spots (default sm_zps24ai_holdout_radius)
//   "prefer"  "up" = upper floors only, "both" = upper floors and basements (default)
//   "ground"  the ground-floor height that "upper" and "basement" are measured from (default: home z)
"Maps"
{
	"zps_cinema"
	{
		// The cinema building, west of the survivors' street spawn: its upper floors are the
		// place to hold out. Zombies spawn at basement level next to it, so no basements.
		"home"		"-2650 600 100"
		"radius"	"1100"
		"prefer"	"up"
		"ground"	"-95"	// street level: heights are measured from here
	}
}
